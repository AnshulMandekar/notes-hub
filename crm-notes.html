# CRM Platform User Workflow & Lifecycle Guide

This guide details the step-by-step operational workflows of the CRM platform. It explains the interactions of the three primary actors—**Company Admins (Developers)**, **Sales Employees (Agents)**, and **Leads (Customers)**—and maps every real-life action to its underlying database model transitions.

---

## 1. Actor Personas & System Access

1. **Company Admin / Developer User (`User.js`):**
   * Configures company parameters, tax registrations (GST/PAN), and billing locations.
   * Manages project inventories (properties, towers, individual flats).
   * Provisions credentials and permissions for sales agents.
   * Monitors performance metrics and financial reports.
2. **Sales Employee / Agent (`Employee.js`):**
   * Accesses the platform using assigned credentials and OTP challenges.
   * Claims, updates, logs calls, and sends text alerts to leads.
   * Finalizes flat reservations and initiates booking agreements.
3. **Lead / Prospective Buyer (`lead.js`):**
   * Submits enquiries online or via broker sheets.
   * Receives communications (emails, SMS) and selects target units.
   * Becomes a buyer upon booking confirmation.

---

## 2. Workflow 1: Admin Setup & Real Estate Inventory Config

Before sales operations can begin, the admin must establish the project catalog.

```mermaid
sequenceDiagram
    actor Admin as Admin (Developer)
    participant API as Express API Server
    participant DB as MongoDB Cluster

    Admin->>API: Sign Up / Log In (User details, PAN, GST)
    API->>DB: Create User Document
    DB-->>Admin: Account Verified (OTP validated)

    Admin->>API: Add Real Estate Project (Name, Address, Amenities)
    API->>DB: Save Property Document
    DB-->>Admin: Project Added (ID generated)

    Admin->>API: Add Towers/Buildings (Wing Name, Floor Counts)
    API->>DB: Save Building Document (ref Project ID)
    API->>DB: Push Building reference into Property's array
    DB-->>Admin: Building Linked

    Admin->>API: Load Flats / Unit Catalog (Flat #, Price, Floor, Area)
    API->>DB: Save Flat Documents (ref Building ID)
    API->>DB: Push Flat references into Building's array
    DB-->>Admin: Flats Populated (Inventory Locked)

    Admin->>API: Add Sales Agents (Email, Username, Role)
    API->>DB: Save Employee Document (ref CompanyId)
    DB-->>Admin: Employee Account Prepared
```

### Action-to-Model Mapping:
1. **Developer Registration:** Creates a `User` document.
2. **Create Project:** Creates a `Property` document.
3. **Add Building Wing:** Creates a `Building` document containing `project_id`. The project ID is appended to `Property.buildings`.
4. **Populate Units:** Creates multiple `Flat` documents containing `building_id`. Flat IDs are appended to `Building.flats`.
5. **Staff Hiring:** Creates `Employee` documents referencing the Admin's `CompanyId`.

---

## 3. Workflow 2: Sales Agent Follow-up & Interaction Loop

Once inventory is configured and staff are active, leads are processed through the sales pipeline.

```mermaid
flowchart TD
    Inflow([Lead Acquisition: Form / CSV Import]) -->|Create Lead Document| Unassigned[Unassigned Leads Pool]
    Unassigned -->|Agent Claims Lead| Assigned[Lead Assigned to Agent]
    
    subgraph Follow-up Engagement Loop
        Assigned --> LogCall[Log Agent Phone Call]
        LogCall -->|Update callHistory Array| LeadStatusChange{Review Status?}
        
        Assigned --> SendSMS[Send Outbound SMS]
        SendSMS -->|Create SMS Doc & Twilio Delivery| LeadStatusChange
        
        Assigned --> Schedule[Schedule Video/Audio Call]
        Schedule -->|Create ScheduledCall Document| LeadStatusChange
    end

    LeadStatusChange -->|If Cold / Lost| Terminate([Archive Lead])
    LeadStatusChange -->|If Contact Established| Warm[Set Lead to Warm / Hot]
    Warm -->|Pushes entry into statusHistory| EngagementLoop[Refine Property Search]
    EngagementLoop -->|Customer Selects Flat| BookingFlow([Proceed to Booking Flow])
```

### Action-to-Model Mapping:
1. **Lead Creation:** Creates a `Lead` document with status `"Hot"`, `"Warm"`, or `"Cold"` and preferences like `typeOfUnits` (e.g. `"2BHK"`).
2. **Call Logging:** Agent submits call details. The controller runs a `$push` update to append `{ date, type, duration, notes }` into the `Lead.callHistory` array and increments `calls.made`.
3. **Callback Reminders:** Agent books a follow-up. Creates a `ScheduledCall` document referencing `leadId` and sets the `dateTime` trigger.
4. **SMS Dispatch:** Backend triggers Twilio API and saves a new `SMS` document mapping `leadId`, message content, and transmission statuses (`queued` -> `delivered`).
5. **State Progression:** When the agent updates a lead's category, a `$push` append writes `{ status, changedAt, changedBy }` into `Lead.statusHistory`.

---

## 4. Workflow 3: Flat Booking & Deal Closure

When a lead commits to purchasing a unit, the agent processes the transaction.

```mermaid
sequenceDiagram
    actor Agent as Sales Agent (Employee)
    participant UI as React UI (Booking Screen)
    participant API as Express API Server
    participant DB as MongoDB Cluster
    participant External as Twilio / Nodemailer APIs

    Agent->>UI: Select Project, Tower, and Flat (Checks Availability)
    UI->>API: GET Request /api/properties & /api/flats
    API->>DB: Scan Available Inventory
    DB-->>UI: Displays available flats

    Agent->>UI: Enter Client KYC, Rate terms, and Payment split
    UI->>API: POST Request /api/bookings (Form Data)
    
    Note over API: Generates Atomic Booking Reference (BK-YYYYMMDD-XXXX)
    API->>DB: Save Booking Document (ref Property, Building, Flat)
    API->>DB: Set Flat status to Reserve/Sold
    DB-->>API: Write Confirmation
    
    API->>DB: Create Report Document (mixed analytical details)
    API->>External: Dispatch thank-you Email & SMS confirmation alerts
    API->>UI: Booking Success Response
    UI-->>Agent: Ticket Generated & Dashboard updated via WebSockets
```

### Action-to-Model Mapping:
1. **Inventory Lookup:** API searches `Property`, `Building`, and `Flat` schemas to return active, unsold rooms.
2. **Booking Submission:** Creates a `Booking` document containing:
   * String-based identifier `bookingId`.
   * Reference keys: `propertyId`, `buildingId`, `flatId`, and `companyId`.
   * Nested sub-objects: `flatDetails` (frozen unit dimensions), `clientInfo` (KYC agreements), and `charges` (preferential, parking, maintenance fees).
3. **Reporting Compilation:** Creates a `Report` document. Its `details` property (Mongoose type `Mixed`) stores tax audits and commission margins related to the `bookingId`.
4. **Real-time Synchronization:** Socket.io triggers an event broadcast, while the Twilio and Nodemailer utility packages trigger SMS and email dispatches to the customer.

## 📂 Entity Details

### 1. User
*   **Source File**: `User.js`
*   **Collection Name**: `users`
*   **Description**: Represents the primary business account (Admin / Developer Company) that owns properties, manages employees, and registers customers/leads.
*   **Key Fields**:
    *   `projects`: References multiple projects (`Property` model) that are owned by this user/company.
    *   `role`: Defines the permissions of the user.

### 2. Employee
*   **Source File**: `Employee.js`
*   **Collection Name**: `employees`
*   **Description**: Staff members registered under a specific company/user.
*   **Key Fields**:
    *   `CompanyId`: References the parent user/company from the `users` collection.

### 3. Property / Project
*   **Source File**: `Project.js`
*   **Collection Name**: `properties` (registered as `Property`)
*   **Description**: A real estate project listing. Contains pricing parameters, coordinates, phases, and files.
*   **Key Fields**:
    *   `CompanyId`: References the owning User (`users` collection).
    *   `buildings`: References an array of building ObjectIds belonging to the project.
    *   `files`: Subdocument schema storing URLs and filenames for project documents.

### 4. Building
*   **Source File**: `Building.js`
*   **Collection Name**: `buildings`
*   **Description**: A building block within a Project.
*   **Key Fields**:
    *   `project_id`: References the parent `Property` model.
    *   `flats`: References flat ObjectIds in this building.
*   **Constraint**: Unique index on `{ project_id, buildingName }` prevents duplicate building names in the same project.

### 5. Flat
*   **Source File**: `Flat.js`
*   **Collection Name**: `flats`
*   **Description**: An individual flat/unit within a building.
*   **Key Fields**:
    *   `building_id`: References the parent `Building` model.
*   **Constraint**: Unique index on `{ building_id, flat_number }` prevents duplicate flat numbers in the same building.

### 6. Booking
*   **Source File**: `Booking.js`
*   **Collection Name**: `bookings`
*   **Description**: A flat booking transaction made by a client.
*   **Key Fields**:
    *   `propertyId`, `buildingId`, `flatId`: Link the booking to the real estate inventory.
    *   `companyId`: The company/User recording the booking.
    *   `flatDetails`: Embedded snapshot of flat configuration at the time of booking.
    *   `clientInfo`: Embedded details about applicants and KYC.
    *   `charges`: Snapshot of various rates and development fees.

### 7. Report
*   **Source File**: `Report.js`
*   **Collection Name**: `reports`
*   **Description**: Reporting data generated for a Booking.
*   **Key Fields**:
    *   `bookingId`: Refers to the **string** `bookingId` field of a `Booking` document (rather than an ObjectId).

### 8. Lead
*   **Source File**: `lead.js`
*   **Collection Name**: `leads`
*   **Description**: A potential client who has shown interest in a property type.
*   **Key Fields**:
    *   `CompanyId`: References the owner company (`User`).
    *   `callHistory` / `statusHistory`: Nested tracking structures recording client interaction logs.

### 9. PersonalInfo
*   **Source File**: Defined inline in `server.js:L130-255`
*   **Collection Name**: `personalinfos`
*   **Description**: Forms submitted by clients containing personal information. It runs parallel to the `Lead` model in `/api/personal-info` routing.
*   **Key Fields**:
    *   `CompanyId`: References the owner company (`User`).

### 10. ScheduleCall
*   **Source File**: `ScheduleCall.js`
*   **Collection Name**: `scheduledcalls` (registered as `ScheduledCall`)
*   **Description**: A schedule reminder for audio or video calls with a lead.
*   **Key Fields**:
    *   `leadId`: References the `PersonalInfo` model (representing the lead).
    *   `createdBy`: References the User model.

### 11. SMS
*   **Source File**: `SMS.js`
*   **Collection Name**: `sms`
*   **Description**: SMS messages sent to/from leads using Twilio integrations.
*   **Key Fields**:
    *   `leadId`: References the `Lead` model (note: contrasts with `ScheduleCall` which references `PersonalInfo`).

### 12. Message
*   **Source File**: `Message.js`
*   **Collection Name**: `messages`
*   **Description**: Direct team messaging system.
*   **Key Fields**:
    *   `senderId` & `receiverId`: String-based IDs of the sender and receiver.

### 13. Event
*   **Source File**: `Event.js`
*   **Collection Name**: `events`
*   **Description**: Calendar events or meetings.
*   **Key Fields**:
    *   `createdBy`: References the creator user.
    *   `CompanyId`: Stored during runtime routes to scope queries to the company workspace.

## ⚠️ Notes & Schema Anomalies

1. **Reference Naming Discrepancies**:
   * Some schemas reference `User` models using `ref: "User"` (e.g. `Event.js`, `Booking.js`, `lead.js`, `ScheduleCall.js`).
   * Other schemas reference `User` models using `ref: "users"` (e.g. `Employee.js`, `Project.js`). Mongoose automatically registers model names, but mismatching case and pluralization in `ref` values can lead to populating bugs if not carefully handled.
2. **Double Lead Schemas**:
   * The codebase defines a standalone `Lead` model in `models/lead.js` and an inline `PersonalInfo` model in `server.js` that represents very similar data structures. `ScheduleCall` links to `PersonalInfo` while `SMS` links to `Lead`.
3. **Redundant Client Schema**:
   * An unused `Client` schema is declared inline in `server.js`. Actual client data for purchases is captured as embedded subdocuments (`clientInfo`, `charges`) inside the `Booking` schema.

# Proposed Reconstructed ER Diagram & Database Architecture

This document presents an optimized, standardized, and clean database design for the CRM project. It resolves all redundant collections, naming style mismatches, schema bugs, and reference type inconsistencies identified in the original database code.

---

## 🛠️ Key Architectural Enhancements

1. **Unified Lead Management**:
   * Consolidated the `Lead` and `PersonalInfo` models into a single, comprehensive `Lead` model.
   * Dropped the duplicate `personalinfos` collection. All features (call history, scheduled calls, and SMS messaging) now link back to the unified `Lead` schema.
2. **Normalized Field Names (CamelCase)**:
   * Replaced snake_case fields (`project_id`, `building_id`, `flat_number`, `number_of_floors`) with camelCase fields (`projectId`, `buildingId`, `flatNumber`, `numberOfFloors`) to align with JavaScript/Mongoose conventions.
3. **Standardized Company References**:
   * Unified all company/admin ownership fields to `companyId` (lowercased `c`).
   * Standardized all user references to `ref: "User"` (singular and capitalized) instead of mixing `ref: "User"` and `ref: "users"`.
4. **Stronger Relationships & Typing**:
   * Linked `Booking` directly to `Lead` using `leadId: ObjectId`.
   * Standardized `Report.bookingId` to use an `ObjectId` ref to `Booking` instead of a loose string ref.
   * Explicitly added `companyId` to the `Event` schema to match its route-level usage.
   * Defined `senderId` and `receiverId` in `Message` as ObjectIds mapping to the User collection.
5. **Cleaned Redundant Schemas**:
   * Removed the unused `Client` model from the code. Client booking snapshot properties remain nested inside `Booking` under `clientInfo` and `charges`.

## 💡 Why This Reconstruction is Better

1. **High Performance Queries**: By standardizing all references as ObjectIds and unifying models, we can leverage indexing optimally and perform fast `.populate()` joins.
2. **Data Consistency**: Having a single `Lead` schema prevents synchronization bugs where a phone call update affects a `PersonalInfo` record but leaves the corresponding `Lead` record stale.
3. **Historical Audit Capability**: The `Booking` model links directly to the original customer via `leadId`, but maintains a copied snapshot of the flat pricing (`flatDetails`) and client parameters (`clientInfo`). If the flat rate changes or the lead details are updated in the future, the Booking contract record remains historically accurate.
4. **Maintenance Ease**: Resolving the casing and pluralization inconsistencies in `ref` avoids developer confusion and unexpected nulls during Mongoose queries.

# System Design & MongoDB Analysis: CRM Platform at Scale

This document provides a detailed breakdown of why MongoDB is used in modern web applications, why it was the ideal choice for this specific CRM project, and a system design architecture that scales to support high traffic and sudden spikes, detailed with real-world scenarios for each point.

---

## 1. Why MongoDB is Used (General Capabilities)

MongoDB is a document-oriented, NoSQL database designed for high performance, high availability, and easy scalability. Here are the core reasons for its widespread adoption:

### Dynamic & Flexible Schema (BSON Format)
* **Description:** Stores data as JSON-like binary documents (BSON). Each document can have different fields, structures, and data types without database lock constraints.
* **Real-Life Scenario:** 
  Imagine the company decides to start capturing social media handles (e.g., WhatsApp Business numbers, Instagram handles, or Threads profiles) for Leads.
  * **Relational Database (SQL):** You would have to execute an `ALTER TABLE leads ADD COLUMN instagram_handle VARCHAR(255)` migration. For a table with millions of leads, this can lock the database table, preventing sales agents from creating or modifying leads during the migration.
  * **MongoDB (NoSQL):** You simply update your frontend and backend to start saving `{ instagramHandle: "@username" }` inside new lead documents. Legacy documents remain unchanged, there is no need for schema migrations, and there is zero database downtime.

### Natural Data Modeling (Document Nesting)
* **Description:** Allows embedding lists, objects, and nested structures directly within a single document, eliminating the performance overhead of database joins.
* **Real-Life Scenario:** 
  A sales representative opens a customer's profile on the CRM dashboard and needs to see the customer's phone call interaction logs.
  * **Relational Database (SQL):** The backend must execute a `SELECT * FROM leads JOIN call_history ON leads.id = call_history.lead_id WHERE leads.id = ?` query. If a lead has 100 call records, the DB engine performs a join operation in memory. If 1,000 agents do this simultaneously, server RAM usage spikes.
  * **MongoDB (NoSQL):** The lead and their `callHistory` array are stored in the *same* document on disk. The system performs a single key-value lookup and returns the entire record instantly without joining tables.

### Built-in Horizontal Scalability (Sharding)
* **Description:** Scales horizontally by distributing data across multiple physical partitions called shards.
* **Real-Life Scenario:** 
  During a major housing development launch, the database size spikes from 500,000 leads to 50,000,000 records, which exceeds the RAM and storage capacity of a single database server.
  * **Relational Database (SQL):** You must purchase a larger, much more expensive server (vertical scaling) to handle the database, which has physical limits.
  * **MongoDB (NoSQL):** The cluster administrator configures a **shard key** (e.g., `companyId`). MongoDB automatically distributes companies A-M to Shard Server 1 and N-Z to Shard Server 2. You scale capacity and write speeds horizontally using inexpensive hardware.

### High Availability & Fault Tolerance (Replica Sets)
* **Description:** Groups database nodes into replica sets (Primary-Secondary model) for automatic data redundancy and instant failover.
* **Real-Life Scenario:** 
  The primary database server in the cloud data center suffers a sudden hardware crash or power outage at 2:00 PM on a busy workday.
  * **Relational Database (SQL):** Without a complex active-active setup, database access stops. Developers must manually trigger failover scripts or promote a read-replica, causing minutes or hours of application downtime.
  * **MongoDB (NoSQL):** The remaining Secondary nodes in the replica set automatically detect the loss of the Primary node. Within 2 to 3 seconds, they hold a background election, promote a Secondary node to Primary, and the CRM backend reconnects seamlessly with no data loss and zero impact on sales agents.

---

## 2. Why MongoDB is the Best Option for This CRM Project

By examining the codebase, we can tie the advantages of MongoDB directly to the CRM's models and functionalities:

### A. Nested Lead History in `lead.js`
* **Description:** Lead schema stores dynamic arrays like `callHistory` and `statusHistory` inside the Lead document itself.
* **Real-Life Scenario:** 
  A real estate agent reviews a prospect who has been contacted 5 times, changed status from "Warm" to "Confirmed", and has multiple follow-up notes.
  * **How it works:** When the agent clicks the lead's profile, MongoDB performs one read lookup. The backend returns the entire document containing the `callHistory` array (date, duration, notes) and `statusHistory` array (status, changedAt, changedBy) directly to the React UI, displaying a complete audit log in under 50ms.

### B. Complex Nested Bookings in `Booking.js`
* **Description:** Houses structured, sub-object details like flat specifications, client info, and itemized service charges in one document.
* **Real-Life Scenario:** 
  An agent registers a property booking. They must record the customer info, the specific flat details (price, area, floor), and various charges (maintenance, car parking, society formation charges).
  * **How it works:** When the booking form is submitted, the backend writes a single object containing `flatDetails`, `clientInfo`, and `charges` directly to MongoDB. This operation is **atomic**—meaning either the entire booking saves successfully or none of it does. You avoid the risk of saving a booking details row in SQL but failing to save the corresponding parking charges rows, which would result in orphaned or corrupted billing records.

### C. Dynamic Lead Imports via Excel/CSV
* **Description:** The backend package list in `package.json` includes `csvtojson` and `xlsx` to parse lead lists.
* **Real-Life Scenario:** 
  A marketing team purchases a lead list from a real estate expo. The spreadsheet has custom columns like `EventDiscountCoupon` and `PreferredLocationDescription` which do not exist in the standard CRM database fields.
  * **How it works:** The user uploads the spreadsheet. The backend parses it directly to JSON and saves the documents into MongoDB. MongoDB accepts these additional custom key-value pairs without throwing errors. The sales reps can view and filter these custom fields immediately on their dashboard, without waiting for database engineers to update database tables.

---

## 3. High-Scale System Design Solution (Handling Traffic Spikes)

To handle a large number of users and survive sudden spikes of traffic (e.g., major marketing campaigns, bulk SMS broadcasts, or property launching days), we must evolve the architecture beyond a single-node host.

### 3.1 Architectural Diagram
```mermaid
graph TD
    Client[Web & Mobile Clients] -->|HTTPS / WSS| CDN[Cloudflare / CloudFront CDN]
    CDN -->|Static Assets cached| S3[AWS S3 Bucket / Cloudinary]
    CDN -->|API requests| ALB[AWS Application Load Balancer]
    
    subgraph Compute Layer
        ALB -->|Route traffic| ECS[AWS ECS Fargate Cluster]
        ECS -->|Node App 1| Node1[Express Server Node 1]
        ECS -->|Node App 2| Node2[Express Server Node 2]
        ECS -->|Node App N| NodeN[Express Server Node N]
    end
    
    subgraph Caching & Real-Time Layer
        Node1 & Node2 & NodeN -->|Session Cache / Rate Limits| Redis[(Redis Cluster)]
        Node1 & Node2 & NodeN -->|Socket.io PubSub| Redis
    end

    subgraph Messaging & Async Layer
        Node1 & Node2 & NodeN -->|Push bulk tasks| SQS[AWS SQS Queues]
        SQS -->|Consume tasks| Workers[Background Worker Nodes]
        Workers -->|Bulk writes| MongoDB
    end

    subgraph Database Layer
        Node1 & Node2 & NodeN -->|Read/Write| MongoDB[(MongoDB Atlas Multi-AZ Shard Cluster)]
        Workers -->|Write| MongoDB
        MongoDB -->|Primary - Writes| M_Primary[(Primary Node - AZ1)]
        MongoDB -->|Secondary - Reads| M_Sec1[(Secondary Node - AZ2)]
        MongoDB -->|Secondary - Reads| M_Sec2[(Secondary Node - AZ3)]
    end
```

---

### 3.2 System Components & Real-Life Traffic Scenarios

#### A. Traffic Control & Asset Offloading (CDN & AWS S3/Cloudinary)
* **Real-Life Scenario:** A developer launches a massive social media ad campaign for a new apartment building. 100,000 interested buyers click the landing page link at the same time to view property brochures and floor plans.
* **How it works:** The Cloudflare/CloudFront CDN handles all incoming requests for the React frontend, caching style sheets, scripts, and heavy property PDF brochures. The actual Node.js Express server does not process these requests. Only active API submissions (e.g., "Request a Call Back" form submissions) bypass the CDN and hit the application server, saving bandwidth and processing power.

#### B. Compute Auto-Scaling (ECS Fargate Containers)
* **Real-Life Scenario:** At 9:00 AM on a Monday, 2,000 sales agents log into the CRM simultaneously, running dashboards, importing lists, and updating lead sheets, pushing the API servers' CPU usage to 95%.
* **How it works:** AWS ECS Fargate registers the CPU surge. Within 60 seconds, it launches 4 new containers running your Express API server. The Application Load Balancer (ALB) begins distributing the incoming HTTP requests across the new containers, dropping the average container CPU load back to 40% and keeping API latency under 100 milliseconds.

#### C. Asynchronous Task Processing (AWS SQS Queue)
* **Real-Life Scenario:** A CRM admin uploads a spreadsheet containing 50,000 new leads and simultaneously clicks "Send SMS Blast" to alert them about a property sale.
* **How it works:** Instead of processing 50,000 SMS requests synchronously inside Node's main thread (which would lock the application and cause timeout errors for other users), the API server registers the upload, drops the 50,000 messages as individual payloads onto an **AWS SQS Queue**, and immediately tells the admin: *"Your task is being processed in the background."* Dedicated background workers pull jobs from SQS and trigger them at a controlled rate, keeping the database and API servers completely responsive.

#### D. Caching & Session Management (Redis Cluster)
* **Real-Life Scenario:** A sales agent logs in, opens a lead sheet, and starts editing details. As the backend auto-scales, their subsequent requests are routed to a completely different API container.
* **How it works:** Instead of storing session states in local API memory, user sessions and authentication JWTs are cached inside a fast, centralized **Redis Cluster** (retrieved in <1ms). When the agent's request hits Node Server 3, Server 3 validates the session token from Redis, allowing the user to navigate the application seamlessly without being logged out when the compute layer scales.

#### E. Database Optimization (Replica Set Read-Splitting & Sharding)
* **Real-Life Scenario:** A manager runs a complex monthly sales performance report scanning 5,000,000 leads and bookings, while hundreds of agents are actively typing and saving call logs.
* **How it works:** 
  * The Mongoose driver routes the manager's reporting query (read-only) to a Secondary replica database node using `readPreference: 'secondaryPreferred'`.
  * The agents' call log writes are executed directly on the Primary database node. 
  * This isolation ensures that a large, complex analytical query does not lock the database or slow down active sales transactions for agents on the phone.
  * In addition, using `CompanyId` as a Shard Key ensures that all data for a specific company is located on a single database partition, avoiding slow scatter-gather queries across the database cluster.

---

## 4. Current Codebase System Design (The Current Architecture)

The project is designed as a modular web application with distinct front-end and back-end layers. Here is how the parts cooperate:

### A. The Front-End (Client Layer)

### 1. `User` (`User.js`)
* **Role:** The principal tenant account, representing the real estate developer or company admin.
* **How it works:** Stores system credentials, GST numbers, PAN details, and corporate addresses. It references the company's real estate projects via a `projects` array linking to `Property` models. All entities in the workspace ultimately tie back to a `User`'s primary company ID.

### 2. `Employee` (`Employee.js`)
* **Role:** A sales agent or platform administrator hired by the developer.
* **How it works:** Links to the tenant using `CompanyId` (referencing the `User` model). Stores authorization roles, contact details, credentials, and OTP validation keys used for login verification. 

### 3. `Property` (`Project.js`)
* **Role:** A specific real estate construction development project.
* **How it works:** Maps attributes of a property location (land area, address, completion dates, amenities, RERA certifications, and files). It tracks associated buildings via a references array of `buildings` (pointing to `Building` models) and relates back to the firm via `CompanyId`.

### 4. `Building` (`Building.js`)
* **Role:** An individual structure, wing, or tower constructed inside a development site.
* **How it works:** References its parent project (`project_id` pointing to `Property`) and tracks a `flats` array pointing to `Flat` inventory models. It applies a compound unique index on `{ project_id, buildingName }` to ensure no tower is duplicated in the same project.

### 5. `Flat` (`Flat.js`)
* **Role:** A single inventory unit (apartment, row house, or plot) available for purchase.
* **How it works:** Maps to a specific `Building` via `building_id`. Holds unit specifications (flat number, size category, area in sq. ft., base pricing). A unique index enforces `{ building_id, flat_number }` to verify that unit numbers cannot overlap inside the same building.

### 6. `Lead` (`lead.js`)
* **Role:** A potential customer.
* **How it works:** Stores client contact info, location requirements (Studio, 3BHK, etc.), source (Social Media, Broker), status priority (Hot, Cold, Warm), and assignee associations. Embedded arrays like `callHistory` and `statusHistory` act as automated audit timelines, tracking sales efforts in real-time.

### 7. `Booking` (`Booking.js`)
* **Role:** A sales order documenting a finalized unit purchase.
* **How it works:** Resolves relations by linking `propertyId`, `buildingId`, and `flatId` together under a client. It auto-generates a booking reference (`BK-YYYYMMDD-XXXX`) and captures billing arrays and flat descriptions (`flatDetails`, `charges`, `clientInfo`) in a single JSON document.

### 8. `ScheduleCall` (`ScheduleCall.js`)
* **Role:** An appointment scheduling tracker for callbacks.
* **How it works:** Links to a customer (`leadId`) and logs the meeting parameters: scheduled time, duration in minutes, type (Video/Audio), agenda notes, status (scheduled, missed, completed), and the organizer (`createdBy`).

### 9. `SMS` (`SMS.js`)
* **Role:** A system message dispatcher log.
* **How it works:** References a `Lead`. Stores Twilio identifiers (`twilioSid`), direction flags (`inbound`/`outbound`), dispatch statuses (`queued`, `sent`, `delivered`, `failed`), and Twilio API error metrics. Contains performance indices on `leadId` and `sentAt` for quick timeline rendering.

### 10. `Event` (`Event.js`)
* **Role:** A generic calendar agenda log for coordinating sales calls or site visits.
* **How it works:** Stores start/end date-strings, visual color codes, action labels, and references the administrative creator (`createdBy`).

### 11. `Message` (`Message.js`)
* **Role:** A messaging logs container.
* **How it works:** Logs text chats between app users (like agent-to-agent chats), tracking sender/receiver IDs, timestamps, and message read statuses.

### 12. `Report` (`Report.js`)
* **Role:** An analytics container for bookings.
* **How it works:** Points to a booking using a string-based `bookingId`. Uses Mongoose's dynamic `Mixed` schema data type within its `details` field to accept any custom reporting structures (sales commission shares, tax logs, amortization schedules) without needing predefined tables.

# Authentication & Security: Interview Notes

How login works in this CRM, how JWT and access/refresh tokens work in general, and the questions interviewers ask about them. Sections marked **In this CRM** describe the actual code. Everything else is general knowledge you should be able to explain.

---

## 1. The 30-Second Answer

> "Login is two-step. The user sends a username and password, which the server checks against a bcrypt hash. If that's correct, the server sends a 6-digit OTP by SMS, storing only its hash with a 5-minute expiry and a limit of 5 attempts. When the OTP is verified, the server signs a JWT containing the user ID, valid for 1 day. The React app stores it and an Axios interceptor attaches it to every request as a Bearer token. Middleware verifies the signature, and tenant guards check that the record belongs to the user's company."

**Be honest about this:** the CRM uses a **single JWT**, not an access + refresh token pair. Section 5 explains the pair. Don't say you built refresh tokens here.

---

## 2. Basics: Authentication vs Authorization

| | Authentication (AuthN) | Authorization (AuthZ) |
|---|---|---|
| **Question** | Who are you? | What are you allowed to do? |
| **Happens** | First | After authentication |
| **Example** | Password + OTP | Admin-only route, company ownership check |
| **Failure code** | `401 Unauthorized` | `403 Forbidden` |

**Memory trick:** 401 means "I don't know who you are." 403 means "I know who you are, and the answer is no."

**Why HTTP needs any of this:** HTTP is stateless. Each request arrives knowing nothing about the previous one, so every request must carry proof of identity. That proof is a session ID or a token.

---

## 3. Sessions vs Tokens

| | Session (stateful) | JWT (stateless) |
|---|---|---|
| **Where the data lives** | Server (Redis or DB) | Inside the token, held by the client |
| **Client holds** | A random session ID in a cookie | The signed token |
| **Each request** | Server looks up the session | Server verifies the signature, no lookup |
| **Scaling** | Needs a shared session store | Any server with the key can verify |
| **Instant logout** | Easy, delete the session | Hard, the token stays valid until `exp` |
| **Size** | Small ID | Larger, sent on every request |
| **Best for** | Traditional web apps, banking | APIs, mobile apps, multiple services |

**Neither is always better.** The main trade-off: JWT gives you scaling without a lookup, and you pay for it by losing easy revocation. Many real systems combine them, with a short JWT plus a refresh token stored in the database.

---

## 4. How JWT Works

JWT (JSON Web Token) is three Base64URL strings joined by dots:

```text
eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9 . eyJ1c2VySWQiOiI2NWYx... . kX9f2Q...
             HEADER                          PAYLOAD            SIGNATURE
```

**Header:** which algorithm signed it.

```json
{ "alg": "HS256", "typ": "JWT" }
```

**Payload:** the claims. This is the shape the CRM issues.

```json
{ "userId": "65f1a2b3c4d5e6f7a8b9c0d1", "iat": 1730700000, "exp": 1730786400 }
```

**Signature:** proves that nobody changed the header or payload.

```text
HMACSHA256( base64url(header) + "." + base64url(payload), SECRET )
```

### Signing and verifying

```mermaid
sequenceDiagram
    participant C as Client
    participant S as Server
    C->>S: Login with valid credentials
    S->>S: Build header and payload
    S->>S: Sign with JWT_SECRET
    S-->>C: Return token
    C->>S: Request with Authorization Bearer token
    S->>S: Recompute signature from header and payload
    S->>S: Compare with signature in token
    S->>S: Check exp has not passed
    S-->>C: 200 with data, or 401 if any check fails
```

### Why tampering fails

Suppose an attacker changes `userId` in the payload to another user's ID. The server recomputes the signature over the changed payload and gets a different result, because the attacker doesn't have the secret and couldn't produce a matching signature. The token is rejected.

### The most common mistake

**JWT is signed, not encrypted.** Anyone can Base64-decode the payload and read it (try jwt.io). So:

- Never put passwords, OTPs, or personal data in it.
- Signing gives you **integrity** (it wasn't changed), not **confidentiality** (it can't be read).
- If the payload must be secret, that's JWE (JSON Web Encryption), which is a separate standard.

### Standard claims

| Claim | Meaning |
|---|---|
| `sub` | Subject, who the token is about |
| `iat` | Issued at |
| `exp` | Expires at, in Unix seconds |
| `nbf` | Not valid before |
| `iss` | Issuer, who created it |
| `aud` | Audience, who it is meant for |
| `jti` | Unique token ID, useful for revocation lists |

### HS256 vs RS256

| | HS256 (symmetric) | RS256 (asymmetric) |
|---|---|---|
| **Keys** | One shared secret signs and verifies | Private key signs, public key verifies |
| **Risk** | Every verifier could also forge tokens | Verifiers can't forge tokens |
| **Use when** | A single backend | Many services, or third parties verify |

The CRM uses HS256 because it has a single backend. With microservices you'd use RS256, so that only the auth service holds the signing key.

---

## 5. Access Token vs Refresh Token

The problem: a long-lived token is dangerous if stolen, and a short-lived one makes users log in constantly. The answer is two tokens with different jobs.

| | Access token | Refresh token |
|---|---|---|
| **Purpose** | Call the API | Get a new access token |
| **Lifetime** | Short, 5 to 15 minutes | Long, 7 to 30 days |
| **Sent to** | Every API route | Only the refresh endpoint |
| **Format** | Usually a JWT | Usually a random string |
| **Stored on the server?** | No | Yes, as a hash |
| **Can be revoked?** | No, it just expires | Yes, delete the row |
| **Browser storage** | In memory | `HttpOnly` cookie |

**Key idea:** the refresh token gives back the revocation that JWT gave up. The access token is fast and stateless, and each refresh is a checkpoint where the server hits the database and can say no. A stolen access token only works for minutes.

### The full flow

```mermaid
sequenceDiagram
    participant C as Client
    participant A as API
    participant D as Database
    C->>A: Login
    A->>D: Store hash of refresh token
    A-->>C: Access token, plus refresh token in HttpOnly cookie
    C->>A: API call with access token
    A-->>C: 200 OK
    Note over C,A: 15 minutes later, access token expires
    C->>A: API call with expired token
    A-->>C: 401 Token expired
    C->>A: POST refresh with cookie
    A->>D: Check hash, not revoked, not expired
    A->>D: Replace with new hash (rotation)
    A-->>C: New access token and new refresh token
    C->>A: Retry original call
    A-->>C: 200 OK
```

### Refresh token rotation

Each refresh token works **once**. Using it returns a new one and invalidates the old one.

**Reuse detection** is what makes this powerful. If an attacker steals a token and uses it, the real user's next refresh presents a token that was already used. The server sees that, concludes the token family is compromised, and revokes all of them. Both parties must log in again, and the attacker is locked out.

### Sketch of the server code

```js
const issueTokens = async (userId, res) => {
  const accessToken = jwt.sign({ userId }, ACCESS_SECRET, { expiresIn: "15m" });
  const refreshToken = crypto.randomBytes(64).toString("hex");

  await RefreshToken.create({
    userId,
    tokenHash: sha256(refreshToken),
    expiresAt: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000),
  });

  res.cookie("refreshToken", refreshToken, {
    httpOnly: true,
    secure: true,
    sameSite: "strict",
    path: "/api/auth/refresh",
  });
  return accessToken;
};
```

```js
app.post("/api/auth/refresh", async (req, res) => {
  const stored = await RefreshToken.findOne({ tokenHash: sha256(req.cookies.refreshToken) });
  if (!stored || stored.expiresAt < new Date()) return res.sendStatus(401);

  if (stored.usedAt) {
    await RefreshToken.deleteMany({ userId: stored.userId }); // reuse: revoke everything
    return res.sendStatus(401);
  }

  stored.usedAt = new Date();
  await stored.save();
  res.json({ accessToken: await issueTokens(stored.userId, res) });
});
```

### Handling expiry in the frontend

An Axios response interceptor catches the 401, calls refresh once, and retries the original request. **Watch out for this:** if five requests fail at the same moment, you'd fire five refreshes, and rotation would treat the extras as reuse. Share one in-flight refresh promise and queue the others behind it.

---

## 6. Where to Store Tokens in the Browser

| Storage | XSS can steal it? | CSRF risk? | Notes |
|---|---|---|---|
| `localStorage` | **Yes** | No | Simple, survives refresh. This is what the CRM uses |
| Memory (JS variable) | Harder | No | Lost on refresh, so it needs a refresh token |
| `HttpOnly` cookie | **No** | **Yes**, needs `SameSite` | JS can't read it, browser sends it automatically |

**Recommended setup:** access token in memory, refresh token in an `HttpOnly; Secure; SameSite=Strict` cookie.

### Cookie flags

| Flag | Effect |
|---|---|
| `HttpOnly` | JavaScript can't read it, which blocks theft through XSS |
| `Secure` | Sent over HTTPS only |
| `SameSite=Strict` | Never sent on cross-site requests, which blocks CSRF |
| `SameSite=Lax` | Sent on top-level link navigation only |
| `SameSite=None` | Always sent, requires `Secure` |
| `Path` | Limits which URLs receive the cookie |

### XSS vs CSRF

- **XSS (Cross-Site Scripting):** the attacker's script runs **on your site**, so it can read `localStorage`. Defend with output escaping, CSP, and `HttpOnly` cookies.
- **CSRF (Cross-Site Request Forgery):** another site makes the victim's browser send a request, and the browser **automatically attaches cookies**. Defend with `SameSite` and CSRF tokens.

**Why the CRM isn't exposed to CSRF:** it sends the token in the `Authorization` header, which a browser never adds automatically, so a forged request has no credentials. The price is that `localStorage` is reachable by XSS. Token storage is always a trade-off between those two attacks.

## 7. Password Storage

**Never store passwords in plain text, and never encrypt them.** Encryption can be reversed. Hashing can't.

**Why not SHA-256?** It's built to be fast. A GPU can try billions of guesses per second. bcrypt is built to be slow.

| Term | Meaning |
|---|---|
| **Hash** | One-way function. Same input, same output, can't be reversed |
| **Salt** | Random value added per password, so identical passwords hash differently. Defeats rainbow tables |
| **Cost factor** | Work grows as 2^cost. Raise it as hardware improves |
| **Pepper** | Optional secret kept outside the database |

A bcrypt hash stores everything needed to verify it, so there's no separate salt column:

```text
$2b$12$N9qo8uLOickgx2ZMRZoMye.IjdQ...
 |   |  |                      |
 alg cost  22-char salt        hash
```

**In this CRM:** `bcrypt.hash(password, 12)` on signup, and `bcrypt.compare()` on login. The policy requires 8+ characters with upper, lower, digit, and special characters.

**Newer option:** Argon2id is the current recommendation for new systems, because it's memory-hard and resists GPUs better. bcrypt is still acceptable. bcrypt also only uses the first 72 bytes of a password.

## 8. In This CRM: Login with OTP

```mermaid
sequenceDiagram
    participant U as User
    participant F as React App
    participant B as Express API
    participant D as MongoDB
    participant T as Twilio
    U->>F: Enter username and password
    F->>B: POST /api/auth/generate-otp
    B->>D: Find in User, then Employee
    B->>B: bcrypt.compare
    B->>D: Save OTP hash, purpose, expiry
    B->>T: Send SMS
    B-->>F: OTP sent
    U->>F: Enter OTP
    F->>B: POST /api/auth/verify-otp
    B->>D: Check hash, purpose, expiry, attempts
    B->>B: jwt.sign with userId, expires in 1 day
    B-->>F: Token, user, redirectTo
    F->>F: Store token in localStorage
    F->>B: Later requests with Bearer token
    B->>B: Verify token, load company
    B-->>F: Data for that company only
```

### Security decisions worth mentioning

| Decision | Code | What it prevents |
|---|---|---|
| Secure random OTP | `crypto.randomInt`, not `Math.random` | Predicting the next OTP |
| OTP stored as a hash | `hashSecret()` with SHA-256 | A DB leak exposing live OTPs |
| 5-minute expiry | `OTP_TTL_MS` | Old OTPs being reused |
| Max 5 attempts | `MAX_OTP_ATTEMPTS`, then burned | Guessing the 6 digits |
| OTP has a purpose | `otpPurpose`: `login` or `reset` | A reset OTP being used to log in |
| Constant-time compare | `crypto.timingSafeEqual` | Timing attacks |
| One generic login error | "Invalid username or password" | Finding out which accounts exist |
| Dummy bcrypt compare | `DUMMY_PASSWORD_HASH` | Timing leaks for unknown users |
| Rate limit | `authLimiter`: 20 per 15 minutes | Credential stuffing, brute force |
| Algorithm pinned | `algorithms: ['HS256']` | `alg: none` and algorithm confusion |
| Secret validated at startup | Must be 32+ characters | Weak signing keys |
| Minimal payload | Only `userId` | Data leaks and stale roles in the token |

**Why only `userId` in the token?** Role and company are read from the database, so a role change applies immediately instead of waiting for the token to expire.

### Why a dummy bcrypt compare?

Without it, an unknown username returns instantly, while a real username takes about 200ms for bcrypt. An attacker could measure that gap to discover valid usernames. Running bcrypt either way makes both paths take the same time.

### Why SHA-256 for the OTP but bcrypt for the password?

Passwords are permanent and reused across sites, so they need a slow hash. An OTP lasts 5 minutes and is limited to 5 tries, so the fast hash is an acceptable trade-off. Note that 6 digits is only 900,000 possibilities, so the hash mainly protects OTPs from casual exposure, and the short expiry does the real work.

### Forgot password flow

1. `POST /forgot-password-otp` returns the **same message whether or not the email exists**, which prevents email enumeration.
2. `POST /verify-password-reset-otp` checks a `reset` purpose OTP and returns a random one-time `resetToken`, valid for 10 minutes. Only its hash is stored.
3. `POST /reset-password` checks that token, hashes the new password, and clears the token.

**Why the extra reset token?** It proves the OTP step happened. Without it, an attacker could call `/reset-password` directly.

### WebSockets

The HTTP middleware doesn't run on socket events, so `io.use()` verifies the JWT at the handshake and sets `socket.userId`. Identity comes from the token, never from the event payload. Otherwise anyone could claim to be any user.

## 9. In This CRM: Authorization and Multi-Tenancy

Each company is an admin `User`, and its employees reference it through `CompanyId`. All data must stay inside its company.

| Guard | What it does |
|---|---|
| `requireCompany` | Logged in, then sets `req.companyId` |
| `requireAdmin` | Must be a company admin, otherwise 403 |
| `guardProject`, `guardBuilding`, `guardFlat`, `guardBooking`, `guardReport` | Confirms the record belongs to `req.companyId` |

**IDOR (Insecure Direct Object Reference)** is the bug these guards prevent. Without them, a logged-in user at Company A could change the ID in a URL and read Company B's booking. Being logged in doesn't mean you own that record.

**Why return 404 instead of 403?** A 403 confirms the record exists. A 404 reveals nothing about what's in other tenants.

**Role-Based Access Control (RBAC)** means permissions attach to roles and users get roles. Username prefixes such as `ADM`, `SAL`, and `LDM` choose which dashboard to open.

> Hiding a button in React is **not** security. Anyone can call the API directly. Every check must also run on the server.

## 10. Common Attacks and Defenses

| Attack | How it works | Defense | In this CRM |
|---|---|---|---|
| **Brute force** | Trying many passwords | Rate limits, lockout | `authLimiter` |
| **Credential stuffing** | Reusing leaked passwords | Rate limits, 2FA | `authLimiter`, SMS OTP |
| **User enumeration** | Different responses reveal accounts | Same message and timing | Dummy compare, generic errors |
| **XSS** | Injected script runs on your page | Escaping, CSP, `HttpOnly` | `helmet` CSP |
| **CSRF** | Browser auto-sends cookies | `SameSite`, CSRF tokens | Bearer header avoids it |
| **Token theft** | Stolen JWT is reused | Short expiry, rotation | 1-day expiry |
| **`alg: none`** | Forged token claims no signature | Pin the algorithm | `algorithms: ['HS256']` |
| **Algorithm confusion** | RS256 public key used as an HS256 secret | Pin the algorithm | `algorithms: ['HS256']` |
| **NoSQL injection** | `{"$ne": null}` matches any record | Reject operator keys | `sanitizeInput` middleware |
| **IDOR** | Changing IDs in a URL | Ownership checks | `guard*` middleware |
| **HTTP parameter pollution** | Duplicate query parameters | Normalize input | `hpp` |
| **SMS pumping** | Abusing paid SMS endpoints | Strict limits | `telephonyLimiter` |
| **Man in the middle** | Intercepted traffic | HTTPS, HSTS | `helmet` |

**NoSQL injection example.** If login did `User.findOne({ username: req.body.username })` and an attacker sent `{"username": {"$ne": null}}`, the query would match the first user. `sanitizeInput` rejects any key starting with `$` or containing a dot.

**CORS is not authentication.** It's a browser rule about which origins can read responses. `curl` and Postman ignore it completely.

## 11. Logout and Revoking JWTs

A JWT can't be cancelled, because the server keeps no record of it. Your options:

| Approach | How | Trade-off |
|---|---|---|
| Short expiry | Access token lives 15 minutes | A small window remains |
| Refresh token deletion | Remove it from the DB on logout | Access token works until expiry |
| Denylist | Store revoked `jti` in Redis until `exp` | Adds a lookup to each request |
| Token version | Keep `tokenVersion` on the user, include it in the JWT, bump it to log out everywhere | Adds a DB read to each request |

**Good use of token version:** "log out of all devices" and invalidating sessions after a password change.

## 12. OAuth 2.0, OpenID Connect and SSO

- **OAuth 2.0** handles **authorization**. It lets an app act on your behalf without getting your password. Example: an app reading your Google Calendar.
- **OpenID Connect (OIDC)** adds **authentication** on top of OAuth, using an ID token (a JWT) that says who the user is. This is "Sign in with Google."
- **SSO (Single Sign-On):** one login for many apps, usually through OIDC or SAML.

**Authorization Code flow with PKCE**, the standard for web and mobile apps:

1. The app redirects the user to Google, with a hash of a random `code_verifier`.
2. The user logs in at Google and approves access.
3. Google redirects back with a short-lived **code**.
4. The app exchanges the code plus the original `code_verifier` for tokens.

PKCE means a stolen code is useless without the verifier. The `state` parameter protects the redirect against CSRF.

**Other terms:** API keys identify an application rather than a user. TOTP (authenticator apps) is safer than SMS OTP, because SMS is exposed to SIM swapping. Passkeys (WebAuthn) replace passwords with public-key cryptography and resist phishing.

## 13. Interview Questions

**Q: What is JWT, and how does it work?**
A signed token with a header, payload, and signature. The server signs it at login and verifies the signature on each request, so it doesn't need to store sessions.

**Q: Is the JWT payload secure?**
It's protected from changes but readable by anyone. It's encoded, not encrypted, so no sensitive data goes inside.

**Q: How is the signature verified?**
The server recomputes it from the header and payload using the secret, then compares the result to the signature in the token.

**Q: What happens if `JWT_SECRET` leaks?**
An attacker can forge a valid token for any user. Rotate the secret immediately, which logs everyone out. That's why it belongs in environment variables, never in code.

**Q: Why use both access and refresh tokens?**
So a stolen access token expires in minutes, while the user stays logged in. The refresh token can be revoked because the server stores it.

**Q: Why not just make the access token long-lived?**
It can't be revoked, so a stolen one would work for the whole lifetime.

**Q: What happens if a refresh token is stolen?**
With rotation and reuse detection, the second use of the same token is detected and the whole family is revoked.

**Q: Where should a refresh token be stored?**
In an `HttpOnly`, `Secure`, `SameSite` cookie on the client, and as a hash on the server.

**Q: Why hash refresh tokens in the database?**
So a DB leak doesn't hand over live sessions, the same reason passwords are hashed.

**Q: `localStorage` or cookies?**
`localStorage` is exposed to XSS. Cookies with `HttpOnly` aren't, but need CSRF protection. Cookies are generally preferred for refresh tokens.

**Q: How do you log a user out with JWT?**
Delete the refresh token on the server and clear the client. For instant logout, use a denylist or token version.

**Q: How do you handle a token expiring mid-session?**
An Axios interceptor catches the 401, refreshes once, retries the request, and queues any other requests that failed meanwhile.

**Q: How do JWTs work across microservices?**
With RS256, the auth service signs with a private key and the others verify with the public key, usually fetched from a JWKS endpoint.

**Q: Why bcrypt instead of SHA-256 for passwords?**
bcrypt is deliberately slow and salted, which makes mass guessing impractical.

**Q: What is a salt? Is it secret?**
A random per-password value that defeats rainbow tables. It isn't secret, and it's stored with the hash.

**Q: What's the difference between 401 and 403?**
401 means not authenticated. 403 means authenticated but not allowed.

**Q: What is the difference between encoding, encryption, and hashing?**
Encoding changes the format and anyone can reverse it (Base64). Encryption is reversible with a key (AES). Hashing is one-way (bcrypt).

**Q: OAuth vs JWT?**
They aren't alternatives. OAuth is a protocol for delegated access, and JWT is a token format. OAuth can use JWTs.

**Q: Authentication in a stateless API, how does the server know who's calling?**
Each request carries the token, and middleware verifies it and attaches the user to `req`.

**Q: How did you protect your OTP flow?**
Secure random generation, hashed storage, a 5-minute expiry, 5 attempts, purpose tags, rate limiting, and constant-time comparison.

**Q: How did you stop one company from seeing another's data?**
Each request resolves the user's company, and guard middleware checks record ownership before the handler runs. It returns 404 so other tenants' IDs can't be probed.
